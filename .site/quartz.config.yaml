# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: BitShelf Notebook
  pageTitleSuffix: " · BitShelf"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: bitshelf.github.io/notebook
  ignorePatterns:
    - README.md
    - .obsidian
    - .agent
    - .vaultexplorer
    - '**/*.zip'
    - '**/*.exe'
    - '**/*.apk'
    - '**/*.rar'
    - '**/*.tgz'
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "./plugins/github-attachments"
    enabled: true
    order: 25
  - source: "./plugins/site-interactions"
    enabled: true
  - source: "./node_modules/@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "./node_modules/@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "./node_modules/@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "./node_modules/@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "./node_modules/@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "./node_modules/@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "./node_modules/@quartz-community/description"
    enabled: true
    order: 70
  - source: "./node_modules/@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "./node_modules/@quartz-community/citations"
    enabled: false
    order: 85
  - source: "./node_modules/@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "./node_modules/@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "./node_modules/@quartz-community/roam"
    enabled: false
    order: 92
  - source: "./node_modules/@quartz-community/quartz-fonts"
    enabled: true
  - source: "./node_modules/@quartz-themes/core"
    enabled: true
    options:
      theme: catppuccin
      mode: both
  - source: "./node_modules/@quartz-community/remove-draft"
    enabled: true
  - source: "./node_modules/@quartz-community/explicit-publish"
    enabled: false
  - source: "./node_modules/@quartz-community/alias-redirects"
    enabled: true
  - source: "./node_modules/@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "./node_modules/@quartz-community/favicon"
    enabled: true
  - source: "./node_modules/@quartz-community/og-image"
    enabled: false
  - source: "./node_modules/@quartz-community/cname"
    enabled: true
  - source: "./node_modules/@quartz-community/canvas-page"
    enabled: true
  - source: "./node_modules/@quartz-community/content-page"
    enabled: true
  - source: "./node_modules/@quartz-community/folder-page"
    enabled: true
  - source: "./node_modules/@quartz-community/tag-page"
    enabled: true
  - source: "./node_modules/@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "./node_modules/@quartz-community/graph"
    # 关系图谱：可通过右侧栏的隐藏/抽屉按钮收起或弹出
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "./node_modules/@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "./node_modules/@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "./node_modules/@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "./node_modules/@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "./node_modules/@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "./node_modules/@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "./node_modules/@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "./node_modules/@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "./node_modules/@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "./node_modules/@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "./node_modules/@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/bitshelf/notebook
    layout:
      position: footer
      priority: 50
  - source: "./node_modules/@quartz-community/recent-notes"
    enabled: false
  - source: "./node_modules/@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "./node_modules/@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "./node_modules/@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 55
  - source: "./node_modules/@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      # 隐藏笔记页面顶部的 Properties（属性）面板，但保留 frontmatter 解析
      # （插件同时负责剥离 YAML frontmatter，禁用插件会导致 frontmatter 泄漏到正文）
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "./node_modules/@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "./node_modules/@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "./node_modules/@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
    excalidraw: {}


