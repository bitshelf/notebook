# Get editor completions based on the config schema
#"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 100
# Inserts a blank line between shell prompts
add_newline = true
scan_timeout = 10
continuation_prompt = "▶▶"


format = """
$hostname\
$memory_usage\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$c\
$cmd_duration\
$line_break\
$sudo\
$character
"""

[hostname]
ssh_only = false
format = "[$ssh_symbol](bold blue)on [$hostname](bold red) "
trim_at = ".companyname.com"
disabled = false

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[→](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[❯](red)"
#success_symbol = "[❯](purple)"
#vicmd_symbol = "[❮](green)"

#Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[c]
disabled = true

[directory]
style = "blue"
read_only = " "
truncation_length = 7
truncate_to_repo = true

[git_branch]
symbol = "  "
format = "[$symbol$branch]($style) "
style = "bright-black"

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[cobol]
disabled = true

[cmake]
disabled = true

[cmd_duration]
min_time = 50
format = "[$duration]($style)"
style = "yellow"

[memory_usage]
disabled = false
format = "[${ram}]($style) "
threshold = -1
symbol = " "
style = "fg:244"
